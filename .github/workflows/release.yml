name: Release

# Tạo App Bundle cho Android và tải symbol lên Crashlytics.
#
# Chạy khi push tag `v*` (ví dụ `v1.0.0`) hoặc bấm tay trong tab Actions.
#
# Lưu ý: `android/app/build.gradle.kts` hiện ký bằng debug key (bản Lab). Muốn
# phát hành thật, cấu hình `signingConfigs.release` bằng GitHub Secrets trước.
#
# Cần secret `FIREBASE_SERVICE_ACCOUNT` để upload symbol; nếu chưa đặt, bước
# upload bị bỏ qua nhưng AAB vẫn được tạo và lưu làm artifact.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_symbols:
        description: 'Tải symbol lên Crashlytics'
        type: boolean
        default: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2
  FIREBASE_PROJECT_ID: prm393-not-lab3
  CRASHLYTICS_APP_ID: '1:1069128102779:android:b151b073a29b1e917203de'

jobs:
  appbundle:
    name: Build AAB + upload symbols
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for deployment credentials
        id: credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SERVICE_ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chưa đặt secret FIREBASE_SERVICE_ACCOUNT — bỏ qua upload symbol."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Obfuscate + split-debug-info để stack trace gọn; symbol phải được tải
      # lên trước khi có crash từ bản build này.
      - name: Build release App Bundle
        run: |
          .github/scripts/flutter-build-retry.sh appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/symbols

      - name: Authenticate to Google Cloud
        if: steps.credentials.outputs.enabled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.upload_symbols)
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        if: steps.credentials.outputs.enabled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.upload_symbols)
        run: npm install --global firebase-tools@15

      - name: Upload symbols to Crashlytics
        if: steps.credentials.outputs.enabled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.upload_symbols)
        run: |
          firebase crashlytics:symbols:upload \
            --app="$CRASHLYTICS_APP_ID" \
            --project "$FIREBASE_PROJECT_ID" \
            build/symbols

      - name: Upload App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload ProGuard mapping
        uses: actions/upload-artifact@v7
        with:
          name: proguard-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: debug-symbols
          path: build/symbols
          if-no-files-found: ignore
          retention-days: 30
