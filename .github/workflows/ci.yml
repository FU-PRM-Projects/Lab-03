name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: flutter --version

      # `flutter analyze` ở gốc cũng phân tích packages/core và web_admin, nên
      # cần pub get cho cả ba.
      - name: Install dependencies
        run: |
          flutter pub get
          (cd packages/core && flutter pub get)
          (cd web_admin && flutter pub get)

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      # Package dùng chung và web admin (Final Assignment).
      - name: Test packages/core
        working-directory: packages/core
        run: flutter test

      - name: Test web admin
        working-directory: web_admin
        run: flutter test

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-web:
    name: Build web
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release web bundle
        run: flutter build web --release

      - name: Build web admin
        working-directory: web_admin
        run: |
          flutter pub get
          flutter build web --release --base-href /admin/

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-release
          path: build/web
          retention-days: 7

  build-android:
    name: Build Android (debug)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Cache bộ phân phối Gradle (~200 MB) và thư viện giữa các lần chạy, để
      # không phải tải lại từ GitHub Releases (hay trả 504).
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # google-services.json và Gradle plugin Crashlytics nằm trong repo, nên
      # job này bắt lỗi cấu hình Firebase trước khi merge. Lỗi tải (5xx,
      # timeout) thì thử lại tối đa 3 lần; lỗi build thật thì dừng ngay.
      - name: Build debug APK
        run: .github/scripts/flutter-build-retry.sh apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  firestore-rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chạy trên project demo-* nên không cần đăng nhập Firebase.
      - name: Run rules tests on the Emulator
        run: npm run test:rules
