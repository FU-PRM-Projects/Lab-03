[package]
name = "discord_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = "0.4.45"
dotenvy = "0.15.7"
ed25519-dalek = "2"
gcp_auth = "0.12.7"
hex = "0.4"
poise = "0.7.1"
rand = "0.10.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rig-agent = "0.46.0"
rig-core = { version = "0.46.0", features = ["reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
